<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynasty Leagues</title>
  <link rel="stylesheet" href="style.css?v=__BUILD__" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>Dynasty Leagues</h1>
      <span id="updated" class="muted"></span>
    </div>
    <select id="league-select" aria-label="League"></select>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="rankings" class="active">Rankings</button>
    <button data-tab="trade">Trade Calculator</button>
    <button data-tab="teams">Teams</button>
    <button data-tab="matchups">Matchups</button>
    <button data-tab="potw">Players of the Week</button>
    <button data-tab="movers">Risers &amp; Fallers</button>
    <button data-tab="news">News</button>
    <button data-tab="rookie">Rookie Mock</button>
    <button data-tab="league">League &amp; Sources</button>
  </nav>

  <main>
    <section id="tab-rankings" class="tab">
      <div class="toolbar">
        <div id="pos-filter" class="chips"></div>
        <input id="search" type="search" placeholder="Search players" />
        <select id="owner-filter" aria-label="Owner filter">
          <option value="all">All players</option>
          <option value="rostered">Rostered</option>
          <option value="fa">Free agents</option>
        </select>
      </div>
      <div class="table-wrap"><table id="rankings"></table></div>
    </section>

    <section id="tab-trade" class="tab hidden">
      <div class="toolbar"><span class="muted">Teams in trade</span><div id="team-count" class="chips"></div></div>
      <div id="trade-sides" class="trade-grid"></div>
      <div id="trade-result"></div>
    </section>

    <section id="tab-teams" class="tab hidden">
      <div class="table-wrap"><table id="teams"></table></div>
      <p id="record-note" class="muted"></p>
      <h3>Best rooms <span class="muted">(league rank by starters and by position; green = top third, red = bottom third)</span></h3>
      <div class="table-wrap"><table id="rooms"></table></div>
      <div id="team-detail"></div>
    </section>

    <section id="tab-matchups" class="tab hidden"><div id="matchups"></div></section>
    <section id="tab-potw" class="tab hidden"><div id="potw"></div></section>
    <section id="tab-movers" class="tab hidden"><div id="movers"></div></section>
    <section id="tab-news" class="tab hidden"><div id="news"></div></section>

    <section id="tab-rookie" class="tab hidden"><div id="rookie"></div></section>
    <section id="tab-league" class="tab hidden">
      <div id="league-info"></div>
    </section>
  </main>

  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
