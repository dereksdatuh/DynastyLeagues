name: UD scan (scratch)
on:
  push:
    branches: ["claude/ud-caleb-scan"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build UD
        run: python -m engine.build --league league-4 --out site/data 2> build.err | tail -20 > build.out || true
      - name: Save
        run: |
          mkdir -p scratch && cp site/data/league-4.json scratch/ || true
          tail -30 build.err > scratch/build.err; cp build.out scratch/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f scratch/ && git commit -qm "scratch data [skip ci]" && git push -q origin HEAD:claude/ud-caleb-scan
