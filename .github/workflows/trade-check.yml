name: Trade check (scratch)
on:
  push:
    branches: ["claude/trade-check-gibbs"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m engine.build --league league-4 --out site/data
      - run: python check_trade.py
